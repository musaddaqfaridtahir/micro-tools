<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background (Matching Brand Logo) -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="112"
    fill="url(#brandGradient)"
  />

  <!-- Subtle Inset Ring for Definition across Light and Dark Browser Themes -->
  <rect
    x="36"
    y="36"
    width="440"
    height="440"
    rx="108"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.25"
    stroke-width="8"
  />

  <!-- Crisp White Utility Wrench / Tool Symbol (Lucide Wrench Scaled) -->
  <g transform="translate(136, 136) scale(10)" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z" />
  </g>
</svg>
